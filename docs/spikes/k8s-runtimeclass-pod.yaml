apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: runcvm
handler: runcvm
---
apiVersion: v1
kind: Pod
metadata:
  name: vm1
spec:
  runtimeClassName: runcvm
  containers:
    - name: main
      image: docker.io/library/alpine:3.22
      command: ["sh", "-c", "uname -r; cat /proc/cpuinfo | grep -m1 'model name'; ip -4 addr show eth0; sleep 3600"]
