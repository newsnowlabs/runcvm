add_dracutmodules+=" virtiofs "
filesystems+=" virtiofs "
# The drivers for the VM's virtual devices, which a generic initramfs built outside the VM would
# otherwise include only by the virtiofs module's choice.
add_drivers+=" virtio_blk virtio_console virtio_net virtio_pci virtio_rng virtio_scsi "
# The initramfs holds only these kernel modules (and those they depend on), rather than every
# driver (as a generic initramfs, built with --no-hostonly, otherwise does): a VM unpacks its
# initramfs into memory as it boots, and RunCVM loads any other module the VM needs from the
# kernel's bundled modules once the root is mounted.
drivers+=" virtio_blk virtio_console virtio_net virtio_pci virtio_rng virtio_scsi virtiofs "
