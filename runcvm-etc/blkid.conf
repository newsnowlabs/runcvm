# libblkid configuration for RunCVM's own commands in the VM, used in place of the image's
# /etc/blkid.conf so that they resolve UUID= and LABEL= the same way whatever the image.
#
# Find devices by probing each block device the kernel lists, without relying on udev's
# /dev/disk/by-* links, and keep no cache.
EVALUATE=scan
CACHE_FILE=/dev/null
