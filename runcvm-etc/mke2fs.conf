# mke2fs configuration for disks that RunCVM creates (RUNCVM_DISKS).
#
# RunCVM runs mke2fs with MKE2FS_CONFIG pointing at this file, so that disks
# are formatted the same way whatever the container's image holds in
# /etc/mke2fs.conf, and so that the features and parameters set here stay the
# same whichever e2fsprogs version is bundled.
#
# Based on e2fsprogs 1.47.4's default (misc/mke2fs.conf.in), with the ext4
# features 'orphan_file' and 'metadata_csum_seed' left out, as in Debian's and
# Ubuntu's configurations, so that the disks remain usable with older tools
# (e.g. e2fsck, resize2fs and tune2fs in the VM's image): 'orphan_file' needs
# e2fsprogs 1.47 or later, and 'metadata_csum_seed' 1.43 or later.

[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384

[fs_types]
	ext3 = {
		features = has_journal
	}
	ext4 = {
		features = has_journal,extent,huge_file,flex_bg,metadata_csum,64bit,dir_nlink,extra_isize
	}
	small = {
		blocksize = 1024
		inode_ratio = 4096
	}
	floppy = {
		blocksize = 1024
		inode_ratio = 8192
	}
	big = {
		inode_ratio = 32768
	}
	huge = {
		inode_ratio = 65536
	}
	news = {
		inode_ratio = 4096
	}
	largefile = {
		inode_ratio = 1048576
		blocksize = -1
	}
	largefile4 = {
		inode_ratio = 4194304
		blocksize = -1
	}
	hurd = {
	     blocksize = 4096
	     inode_size = 128
	     warn_y2038_dates = 0
	}
