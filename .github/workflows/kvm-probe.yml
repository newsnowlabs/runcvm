# Runs the README's "RunCVM in CI" example as written, on a GitHub-hosted runner.
name: KVM probe

on:
  push:
    branches: [claude/ci-kvm-probe]

jobs:
  readme-example:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install RunCVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          curl -s -o - https://raw.githubusercontent.com/newsnowlabs/runcvm/main/runcvm-scripts/runcvm-install-runtime.sh | sudo sh
      - run: docker run --rm --runtime=runcvm alpine uname -a
