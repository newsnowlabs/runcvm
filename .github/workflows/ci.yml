# RunCVM's CI: on pull requests and pushes to main, builds RunCVM on a GitHub-hosted runner,
# installs it, and runs the integration tests (by default the core tier) in real Container/VMs
# under KVM.
# GitHub's ubuntu-24.04 runners provide nested KVM; the job opens /dev/kvm to the runner user.
# The test framework's selftest runs in a separate, quicker job.
#
# What runs, and when:
# - Changes to Markdown files alone (README.md, docs/**, ...) run nothing: neither the build nor
#   the tests read them. On a pull request, this applies to the pull request's whole diff.
# - A commit message containing "[skip ci]" (or "[ci skip]", "[no ci]") skips the run for a push
#   whose latest commit it is: GitHub's own rule, for pull requests and pushes to main alike.
# - Draft pull requests run nothing; marking one ready for review runs CI.
# - Labels on a pull request:
#   - ci:skip      runs nothing while present; removing it runs CI.
#   - ci:extended  runs the extended tier (tests/run --tier extended) in place of the core tier.
#   - ci:all       runs every tier (tests/run --tier all); it takes precedence over ci:extended.
#   Adding ci:extended or ci:all runs the integration tests; other labels run nothing.
# - By hand (workflow_dispatch), the tests input gives tests/run's arguments.
# Drafts and labels act through the jobs' if: conditions, not through event filters: if CI
# becomes a required status check, a skipped job counts as passing, whereas a run that an event
# filter prevents leaves the check pending and blocks merging. The Markdown paths filter and
# [skip ci] prevent the run, so they would need the same treatment then.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      tests:
        description: tests/run arguments (e.g. "--tier all", or tests by name)
        default: --tier core

permissions:
  contents: read

# Concurrency is per job, not per workflow: a run whose jobs are all skipped (e.g. one started by
# an unrelated label) must not cancel a pull request's run in progress, and a skipped job never
# joins its concurrency group.
jobs:
  selftest:
    # Pull requests: not drafts, nor with ci:skip; and not for label changes, except removing
    # ci:skip, since labels select the integration tests' tier, which selftest does not use.
    if: >-
      github.event_name != 'pull_request' || (
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.labels.*.name, 'ci:skip') &&
        github.event.action != 'labeled' &&
        (github.event.action != 'unlabeled' || github.event.label.name == 'ci:skip')
      )
    concurrency:
      group: ci-selftest-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test framework selftest
        run: tests/selftest/run-selftest --docker

  kvm:
    # Pull requests: not drafts, nor with ci:skip; for label changes, only adding a ci: label
    # other than ci:skip, or removing ci:skip.
    if: >-
      github.event_name != 'pull_request' || (
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.labels.*.name, 'ci:skip') &&
        (github.event.action != 'labeled' ||
          (startsWith(github.event.label.name, 'ci:') && github.event.label.name != 'ci:skip')) &&
        (github.event.action != 'unlabeled' || github.event.label.name == 'ci:skip')
      )
    concurrency:
      group: ci-kvm-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # By hand: the tests input. Pull requests: ci:all, then ci:extended, then the core tier.
      TESTS: >-
        ${{ inputs.tests
          || (contains(github.event.pull_request.labels.*.name, 'ci:all') && '--tier all')
          || (contains(github.event.pull_request.labels.*.name, 'ci:extended') && '--tier extended')
          || '--tier core' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest Docker release
        run: |
          # The runner image's Docker can lag Docker's releases; RunCVM's tests need 29.4 or later.
          sudo apt-get remove -y moby-engine moby-cli moby-buildx moby-compose moby-containerd moby-runc || true
          curl -fsSL https://get.docker.com -o "$RUNNER_TEMP/get-docker.sh"
          sudo sh "$RUNNER_TEMP/get-docker.sh"
          sudo systemctl restart docker

      - name: Runner facts
        run: |
          uname -a; nproc; free -m; df -h / | tail -1
          echo "=== CPU virtualisation flags: $(grep -cE '\b(vmx|svm)\b' /proc/cpuinfo || true)"
          lsmod | grep -E '^(kvm|br_netfilter)' || true
          docker version --format 'Docker: client {{.Client.Version}}, server {{.Server.Version}}'

      - name: Open /dev/kvm to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          [ -r /dev/kvm ] && [ -w /dev/kvm ]

      - name: Build RunCVM
        run: |
          # gitlab.alpinelinux.org refuses requests from GitHub-hosted runners (HTTP 418), so the
          # Alpine build stages use aports' GitHub mirror and Alpine's distfiles mirror.
          time ./build/build.sh --tag ci -- \
            --build-arg APORTS_URL=https://github.com/alpinelinux/aports.git \
            --build-arg ALPINE_DISTFILES_MIRROR=https://distfiles.alpinelinux.org/distfiles

      - name: Install RunCVM
        run: |
          sudo REPO=newsnowlabs/runcvm:ci ./runcvm-scripts/runcvm-install-runtime.sh </dev/null
          docker info --format '{{.Runtimes.runcvm.Path}}'

      - name: Run a Container/VM under KVM
        run: |
          # With RUNCVM_QEMU_ACCEL=kvm, RunCVM refuses to start the VM without /dev/kvm rather
          # than falling back to software emulation.
          docker run --rm --runtime=runcvm --env=RUNCVM_QEMU_ACCEL=kvm alpine \
            sh -c 'dmesg | grep -iE "hypervisor detected" | head -1; echo vcpus: $(nproc)'

      - name: Integration tests (${{ env.TESTS }})
        run: |
          # Two tests at a time suits a hosted runner's 4 CPUs and 16 GB of memory. TESTS holds
          # several arguments, so it is split into words.
          # shellcheck disable=SC2086
          RUNCVM_TEST_JOBS=2 tests/run $TESTS --results "$RUNNER_TEMP/results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
